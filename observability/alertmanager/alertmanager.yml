global:
  resolve_timeout: 5m

route:
  receiver: local-observation
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: local-critical
      matchers:
        - severity="critical"
      group_wait: 5s
    - receiver: local-warning
      matchers:
        - severity="warning"

receivers:
  - name: local-observation
  - name: local-critical
  - name: local-warning

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - component
      - alert_class
      - pipeline
