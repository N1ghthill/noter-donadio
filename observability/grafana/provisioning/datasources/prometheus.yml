apiVersion: 1

prune: true

datasources:
  - name: Prometheus
    uid: noter-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      prometheusType: Prometheus
      prometheusVersion: 3.13.1
      timeInterval: 15s

  - name: Alertmanager
    uid: noter-alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
