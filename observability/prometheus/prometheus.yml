global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: noter-backend
    metrics_path: /api/internal/metrics
    http_headers:
      X-Internal-Token:
        files:
          - /run/secrets/metrics_internal_token
    static_configs:
      - targets:
          - backend:3000
