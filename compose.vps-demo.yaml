x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-backend: &backend
  image: noter-donadio-backend:${APP_VERSION:-current}
  build:
    context: .
    dockerfile: backend.Dockerfile
  restart: unless-stopped
  init: true
  logging: *default-logging
  environment: &backend-environment
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    DATABASE_URL: postgresql://${DB_USER:?defina DB_USER}:${DB_PASSWORD:?defina DB_PASSWORD}@postgres:5432/${DB_NAME:-noter_donadio}
    REDIS_URL: redis://redis:6379
    INTERNAL_INGESTION_TOKEN: ${INTERNAL_INGESTION_TOKEN:?defina INTERNAL_INGESTION_TOKEN}
    MEDIA_STORAGE_PATH: /app/backend/storage/media
    MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?defina MEDIA_SIGNING_SECRET}
    MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
    MEDIA_ORPHAN_GRACE_HOURS: ${MEDIA_ORPHAN_GRACE_HOURS:-24}
    MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-10485760}
    APP_ORIGINS: ${APP_ORIGINS:?defina APP_ORIGINS}
    WHATSAPP_ADAPTER: ${WHATSAPP_ADAPTER:-fake}
    MEDIA_DOWNLOAD_ADAPTER: disabled
    TRANSCRIPTION_ADAPTER: disabled
    AI_ADAPTER: disabled
    TRANSCRIPTION_FEATURE_ENABLED: ${TRANSCRIPTION_FEATURE_ENABLED:-false}
    AI_ANALYSIS_FEATURE_ENABLED: ${AI_ANALYSIS_FEATURE_ENABLED:-false}
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  volumes:
    - noter_media:/app/backend/storage/media

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-noter_donadio}
      POSTGRES_USER: ${DB_USER:?defina DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    volumes:
      - noter_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - noter_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: noter-donadio-backend:${APP_VERSION:-current}
    build:
      context: .
      dockerfile: backend.Dockerfile
    logging: *default-logging
    environment:
      <<: *backend-environment
    command: ["../node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  outbox:
    <<: *backend
    command: ["node", "dist/outbox.main.js"]

  baileys:
    <<: *backend
    profiles: ["baileys"]
    command: ["node", "dist/baileys.main.js"]
    environment:
      <<: *backend-environment
      BAILEYS_WORKSPACE_ID: ${BAILEYS_WORKSPACE_ID:-}
      BAILEYS_ACCOUNT_ID: ${BAILEYS_ACCOUNT_ID:-}
      BAILEYS_ENCRYPTION_KEY: ${BAILEYS_ENCRYPTION_KEY:-}
      BAILEYS_ENCRYPTION_KEY_VERSION: ${BAILEYS_ENCRYPTION_KEY_VERSION:-1}
      BAILEYS_PROTOCOL_VERSION: ${BAILEYS_PROTOCOL_VERSION:-2.3000.1043857760}

  realtime:
    <<: *backend
    command: ["node", "dist/realtime.main.js"]

  transcription:
    <<: *backend
    profiles: ["demo", "assistive"]
    command: ["node", "dist/transcription.main.js"]
    environment:
      <<: *backend-environment
      TRANSCRIPTION_ADAPTER: ${TRANSCRIPTION_ADAPTER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-30000}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      OPENAI_TRANSCRIPTION_MAX_DURATION_SECONDS: ${OPENAI_TRANSCRIPTION_MAX_DURATION_SECONDS:-300}
      ASSISTIVE_PROCESSING_NOT_BEFORE: ${ASSISTIVE_PROCESSING_NOT_BEFORE:-}

  media-download:
    <<: *backend
    profiles: ["demo", "baileys"]
    command: ["node", "dist/media-download.main.js"]
    environment:
      <<: *backend-environment
      MEDIA_DOWNLOAD_ADAPTER: ${MEDIA_DOWNLOAD_ADAPTER:-fake}
      BAILEYS_WORKSPACE_ID: ${BAILEYS_WORKSPACE_ID:-}
      BAILEYS_ACCOUNT_ID: ${BAILEYS_ACCOUNT_ID:-}
      BAILEYS_ENCRYPTION_KEY: ${BAILEYS_ENCRYPTION_KEY:-}
      BAILEYS_ENCRYPTION_KEY_VERSION: ${BAILEYS_ENCRYPTION_KEY_VERSION:-1}

  analysis:
    <<: *backend
    profiles: ["demo", "assistive"]
    command: ["node", "dist/analysis.main.js"]
    environment:
      <<: *backend-environment
      AI_ADAPTER: ${AI_ADAPTER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:-gpt-5.6-sol}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-30000}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      OPENAI_ANALYSIS_MAX_OUTPUT_TOKENS: ${OPENAI_ANALYSIS_MAX_OUTPUT_TOKENS:-1000}
      ASSISTIVE_PROCESSING_NOT_BEFORE: ${ASSISTIVE_PROCESSING_NOT_BEFORE:-}

  retention:
    <<: *backend
    command: ["node", "dist/media-retention.main.js"]

  frontend:
    image: noter-donadio-frontend:${APP_VERSION:-current}
    build:
      context: .
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - noter_caddy_data:/data
      - noter_caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  noter_postgres:
  noter_redis:
  noter_media:
  noter_caddy_data:
  noter_caddy_config:
