name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: noter_donadio
          POSTGRES_USER: noter
          POSTGRES_PASSWORD: noter_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noter -d noter_donadio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://noter:noter_ci_only@127.0.0.1:5432/noter_donadio
      REDIS_URL: redis://127.0.0.1:6379
      INTERNAL_INGESTION_TOKEN: ci-only-token-with-more-than-32-characters
      MEDIA_SIGNING_SECRET: ci-only-media-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec -w @noter/backend -- prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
